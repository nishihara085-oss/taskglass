
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6fa">
<title>Glass Task</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
  color: #202333;
  background: #f5f6fa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 10% 0%, #e3eaff 0, transparent 45%),
    radial-gradient(ellipse at 100% 20%, #f5e8ff 0, transparent 38%),
    #f7f8fc;
}
main { max-width: 720px; margin: auto; padding: 32px 20px 80px; }
header { display:flex; align-items:center; justify-content:space-between; }
.brand { font-size: 19px; font-weight: 750; letter-spacing:-.5px; }
.brand span { color:#7586ed; }
.date { color:#85899b; font-size:13px; margin-top:6px; }
.panel {
  margin-top:28px; padding:24px; border:1px solid #ffffffd9;
  border-radius:26px; background:#ffffffb8;
  box-shadow:0 12px 42px #303b6010; backdrop-filter:blur(20px);
}
h1 { font-size:clamp(27px,6vw,38px); letter-spacing:-1.4px; margin:0; }
.sub { color:#85899b; font-size:14px; margin:8px 0 24px; }
.entry { display:flex; gap:8px; }
input, button { font:inherit; }
#taskInput {
  flex:1; min-width:0; border:1px solid #e8eaf2; border-radius:15px;
  padding:14px; background:#fff; outline:none;
}
#taskInput:focus { border-color:#8b99f5; box-shadow:0 0 0 3px #8998f522; }
button {
  border:0; border-radius:14px; padding:12px 16px;
  cursor:pointer; transition:transform .15s, opacity .15s;
}
button:active { transform:scale(.97); }
.add { background:#6879e8; color:white; font-weight:650; }
.tools { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.secondary { background:#f0f2fb; color:#626c9c; font-size:13px; }
.filters { display:flex; gap:8px; margin:24px 0 16px; }
.filter { background:transparent; color:#85899b; padding:8px 12px; }
.filter.active { background:#e9ecff; color:#596bd6; font-weight:650; }
#count { margin-left:auto; color:#989caf; font-size:12px; align-self:center; }
ul { list-style:none; margin:0; padding:0; }
li {
  display:flex; align-items:center; gap:12px; padding:15px 4px;
  border-bottom:1px solid #eceef5; animation:appear .22s ease-out;
}
li:last-child { border-bottom:0; }
.check {
  width:22px; height:22px; border:1.5px solid #d4d8e8;
  border-radius:8px; background:white; padding:0; flex-shrink:0;
}
li.done .check { background:#7787e9; border-color:#7787e9; color:white; }
.task { flex:1; overflow-wrap:anywhere; font-size:15px; }
li.done .task { color:#a4a8b7; text-decoration:line-through; }
.delete { background:transparent; color:#a3a7b7; padding:7px 9px; }
.empty { padding:30px 8px; color:#989caf; text-align:center; font-size:14px; }
footer { color:#a1a5b5; text-align:center; font-size:12px; padding-top:22px; }
@keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
/* Liquid Glass: white translucent surfaces */
.panel {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.92);
  box-shadow:
    0 20px 60px rgba(45, 55, 90, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  backdrop-filter: blur(28px) saturate(160%);
}

#taskInput {
  background: rgba(255, 255, 255, 0.78);
  border-color: rgba(220, 224, 238, 0.8);
  border-radius: 17px;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

li {
  position: relative;
  border-radius: 14px;
  padding-left: 10px;
  padding-right: 10px;
  margin: 3px 0;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  transition:
    background 0.2s ease,
    transform 0.18s ease,
    box-shadow 0.2s ease;
}

li.swipe-right {
  background: rgba(103, 190, 145, 0.15);
}

li.swipe-left {
  background: rgba(245, 110, 110, 0.13);
}

@media (hover: hover) {
  li:hover {
    background: rgba(255, 255, 255, 0.72);
  }
}

@media (prefers-reduced-motion: reduce) {
  li {
    transition: none;
  }
}
@media(max-width:480px) {
  main { padding:22px 14px 48px; }
  .panel { padding:19px; margin-top:22px; border-radius:22px; }
  .entry { flex-wrap:wrap; }
  #taskInput { width:100%; flex-basis:70%; }
  .add { flex:1; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; }
}

/* Clean white design */
:root {
  color: #202938;
  background: #f7f8fa;
}

body {
  background: #f7f8fa;
  color: #202938;
}

main {
  max-width: 760px;
}

.panel {
  background: #ffffff;
  border: 1px solid #e8ebf0;
  box-shadow: 0 8px 28px rgba(25, 40, 65, 0.06);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.add {
  background: #2563eb;
  color: #ffffff;
}

.filter.active {
  background: #eaf1ff;
  color: #1d4ed8;
}

#taskInput {
  background: #ffffff;
  border: 1px solid #d9dee8;
  color: #202938;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid #93b4ff;
  outline-offset: 2px;
}

/* Task cards */
#taskList > li {
  display: block;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #e7eaf0;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 2px 8px rgba(25, 40, 65, 0.03);
}

.task-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.task {
  min-width: 0;
  overflow-wrap: anywhere;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.task-menu {
  max-width: 150px;
  padding: 9px;
  border: 1px solid #d9dee8;
  border-radius: 10px;
  background: #ffffff;
  color: #344054;
  font: inherit;
}

.subtask-details {
  margin: 12px 0 0 32px;
  border-top: 1px solid #edf0f5;
  padding-top: 10px;
}

.subtask-details summary {
  cursor: pointer;
  color: #475569;
  font-size: 13px;
  font-weight: 600;
  padding: 5px 0;
}

.subtask-list {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.subtask-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px;
  border-radius: 10px;
  background: #f7f9fc;
}

.subtask-row input {
  width: 18px;
  height: 18px;
  accent-color: #2563eb;
  flex-shrink: 0;
}

.subtask-name {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.subtask-row.is-done .subtask-name {
  color: #8a94a5;
  text-decoration: line-through;
}

.subtask-add {
  width: 100%;
  margin-top: 8px;
  background: #edf4ff;
  color: #1d4ed8;
  text-align: left;
  font-size: 14px;
}

.task-progress {
  margin: 8px 0 0 32px;
  color: #64748b;
  font-size: 12px;
}

@media (max-width: 480px) {
  .task-menu {
    max-width: 125px;
    font-size: 12px;
  }

  .subtask-details {
    margin-left: 8px;
  }
}


/* Swipe actions: Mail / Slack style */
#taskList > li {
  position: relative;
  overflow: hidden;
  padding: 0;
  border-radius: 16px;
  isolation: isolate;
}

.task-card-content {
  position: relative;
  z-index: 1;
  padding: 14px;
  border-radius: 15px;
  background: #fff;
  transition: transform 180ms ease;
  touch-action: pan-y;
}

.task-card-content.is-dragging {
  transition: none;
}

.swipe-action {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 0;
  border-radius: 0;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.swipe-action span:first-child {
  font-size: 22px;
}

.swipe-delete {
  right: 0;
  background: #dc3545;
}

.swipe-complete {
  left: 0;
  background: #16845b;
}

#taskList > li.swipe-open-left .task-card-content {
  transform: translateX(-100px);
}

#taskList > li.swipe-open-right .task-card-content {
  transform: translateX(100px);
}

.task-card-content .task-row {
  min-width: 0;
}

.task-card-content .task {
  overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
  .task-card-content {
    transition: none;
  }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand"><span>◈</span> Glass Task</div>
      <div class="date" id="today"></div>
    </div>
    <div aria-hidden="true">✧</div>
  </header>

  <section class="panel">
    <h1>思考を、軽やかに。</h1>
    <p class="sub">頭の中のメモを、ひとつずつタスクに。</p>

    <form id="taskForm" class="entry">
      <input id="taskInput" maxlength="500"
        placeholder="次にやることを書き留める…" autocomplete="off"
        aria-label="新しいタスク">
      <button class="add" type="submit">＋ 追加</button>
    </form>
    <div class="tools">
      <button class="secondary" id="voiceButton" type="button">🎙 音声入力</button>
      <button class="secondary" id="clearDone" type="button">完了済みを整理</button>
    </div>

    <div class="filters" aria-label="タスクの絞り込み">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="open">未完了</button>
      <button class="filter" data-filter="done">完了</button>
      <span id="count"></span>
    </div>
    <ul id="taskList"></ul>
    <div id="empty" class="empty">ここから始めましょう。<br>小さな一歩をメモしてみてください。</div>
  </section>
  <footer>あなたのペースで、ひとつずつ。</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const input = $("taskInput");
let tasks = [];
let filter = "all";

try {
  const saved = JSON.parse(localStorage.getItem("glass-task-items") || "[]");
  if (Array.isArray(saved)) tasks = saved;
} catch {}

$("today").textContent = new Intl.DateTimeFormat("ja-JP", {
  year:"numeric", month:"long", day:"numeric", weekday:"long"
}).format(new Date());

function save() {
  localStorage.setItem("glass-task-items", JSON.stringify(tasks));
  render();
}

function render() {
  const list = $("taskList");
  list.replaceChildren();

  // 古いタスクデータにも詳細タスク欄を用意する
  tasks.forEach(task => {
    if (!Array.isArray(task.subtasks)) task.subtasks = [];
  });

  const visible = tasks.filter(task =>
    filter === "all" ||
    (filter === "open" && !task.done) ||
    (filter === "done" && task.done)
  );

  const openCount = tasks.filter(task => !task.done).length;
  $("count").textContent = `未完了 ${openCount}件`;
  $("empty").hidden = visible.length > 0;

  visible.forEach(task => {
    const li = document.createElement("li");
    li.dataset.taskId = task.id;
    if (task.done) li.classList.add("done");

    const row = document.createElement("div");
    row.className = "task-row";

    const check = document.createElement("button");
    check.type = "button";
    check.className = "check";
    check.textContent = task.done ? "✓" : "";
    check.setAttribute(
      "aria-label",
      task.done ? "未完了に戻す" : "完了にする"
    );

    check.onclick = () => {
      task.done = !task.done;
      task.subtasks.forEach(subtask => {
        subtask.done = task.done;
      });
      save();
    };

    const name = document.createElement("span");
    name.className = "task";
    name.textContent = task.text;

    const actions = document.createElement("div");
    actions.className = "task-actions";

    const menu = document.createElement("select");
    menu.className = "task-menu";
    menu.setAttribute("aria-label", `${task.text}の操作`);

    [
      ["", "操作"],
      ["add", "＋ 詳細を追加"],
      ["rename", "名前を変更"],
      ["delete", "タスクを削除"]
    ].forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      menu.append(option);
    });

    menu.onchange = () => {
      const action = menu.value;
      menu.value = "";

      if (action === "add") {
        const value = prompt("追加する詳細タスクを入力してください");
        if (value && value.trim()) {
          task.subtasks.push({
            id: crypto.randomUUID(),
            text: value.trim(),
            done: false
          });
          save();
        }
      }

      if (action === "rename") {
        const value = prompt("新しいタスク名", task.text);
        if (value && value.trim()) {
          task.text = value.trim();
          save();
        }
      }

      if (action === "delete") {
        if (confirm(`「${task.text}」を削除しますか？`)) {
          tasks = tasks.filter(item => item.id !== task.id);
          save();
        }
      }
    };

    actions.append(menu);
    row.append(check, name, actions);
    li.append(row);

    if (task.subtasks.length > 0) {
      const completed = task.subtasks.filter(item => item.done).length;

      const progress = document.createElement("div");
      progress.className = "task-progress";
      progress.textContent =
        `詳細タスク ${completed} / ${task.subtasks.length} 完了`;

      const details = document.createElement("details");
      details.className = "subtask-details";
      details.open = false;

      const summary = document.createElement("summary");
      summary.textContent = "詳細タスクを表示";

      const subtaskList = document.createElement("div");
      subtaskList.className = "subtask-list";

      task.subtasks.forEach(subtask => {
        const subrow = document.createElement("div");
        subrow.className = "subtask-row";
        if (subtask.done) subrow.classList.add("is-done");

        const subcheck = document.createElement("input");
        subcheck.type = "checkbox";
        subcheck.checked = !!subtask.done;
        subcheck.setAttribute(
          "aria-label",
          `${subtask.text}を完了にする`
        );

        subcheck.onchange = () => {
          subtask.done = subcheck.checked;
          task.done =
            task.subtasks.length > 0 &&
            task.subtasks.every(item => item.done);
          save();
        };

        const subname = document.createElement("span");
        subname.className = "subtask-name";
        subname.textContent = subtask.text;

        const submenu = document.createElement("select");
        submenu.className = "task-menu";
        submenu.setAttribute(
          "aria-label",
          `${subtask.text}の操作`
        );

        [
          ["", "操作"],
          ["rename", "名前を変更"],
          ["delete", "削除"]
        ].forEach(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          submenu.append(option);
        });

        submenu.onchange = () => {
          const action = submenu.value;
          submenu.value = "";

          if (action === "rename") {
            const value = prompt("詳細タスクの名前", subtask.text);
            if (value && value.trim()) {
              subtask.text = value.trim();
              save();
            }
          }

          if (action === "delete") {
            if (confirm(`「${subtask.text}」を削除しますか？`)) {
              task.subtasks = task.subtasks.filter(
                item => item.id !== subtask.id
              );
              task.done =
                task.subtasks.length > 0 &&
                task.subtasks.every(item => item.done);
              save();
            }
          }
        };

        subrow.append(subcheck, subname, submenu);
        subtaskList.append(subrow);
      });

      const addButton = document.createElement("button");
      addButton.type = "button";
      addButton.className = "subtask-add";
      addButton.textContent = "＋ 詳細タスクを追加";

      addButton.onclick = () => {
        const value = prompt("追加する詳細タスクを入力してください");
        if (value && value.trim()) {
          task.subtasks.push({
            id: crypto.randomUUID(),
            text: value.trim(),
            done: false
          });
          save();
        }
      };

      details.append(summary, subtaskList, addButton);
      li.append(progress, details);
    } else {
      const addButton = document.createElement("button");
      addButton.type = "button";
      addButton.className = "subtask-add";
      addButton.textContent = "＋ 詳細タスクを追加";

      addButton.onclick = () => {
        const value = prompt("追加する詳細タスクを入力してください");
        if (value && value.trim()) {
          task.subtasks.push({
            id: crypto.randomUUID(),
            text: value.trim(),
            done: false
          });
          save();
        }
      };

      li.append(addButton);
    }

    const deleteAction = document.createElement("button");
    deleteAction.type = "button";
    deleteAction.className = "swipe-action swipe-delete";
    deleteAction.innerHTML = "<span>🗑</span><span>削除</span>";
    deleteAction.setAttribute("aria-label", "タスクを削除");
    deleteAction.onclick = () => {
      if (!confirm("このタスクを削除しますか？")) return;
      tasks = tasks.filter(item => item.id !== task.id);
      save();
      render();
    };

    const completeAction = document.createElement("button");
    completeAction.type = "button";
    completeAction.className = "swipe-action swipe-complete";
    completeAction.innerHTML = "<span>✓</span><span>完了</span>";
    completeAction.setAttribute("aria-label", "タスクを完了");
    completeAction.onclick = () => {
      task.done = !task.done;
      save();
      render();
    };

    const cardContent = document.createElement("div");
    cardContent.className = "task-card-content";
    while (li.firstChild) {
      cardContent.append(li.firstChild);
    }
    li.append(deleteAction, completeAction, cardContent);
    list.append(li);
  });

  document.querySelectorAll(".filter").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.filter === filter
    );
  });
}

// Swipe actions
const taskList = $("taskList");
let swipeStart = null;

function closeSwipeCards(except = null) {
  taskList.querySelectorAll("li.swipe-open-left, li.swipe-open-right")
    .forEach(li => {
      if (li !== except) {
        li.classList.remove("swipe-open-left", "swipe-open-right");
        const content = li.querySelector(".task-card-content");
        if (content) content.style.transform = "";
      }
    });
}

taskList.addEventListener("pointerdown", e => {
  const li = e.target.closest("li");
  if (!li || !taskList.contains(li)) return;

  if (e.target.closest("button, select, input, summary")) return;

  const content = li.querySelector(".task-card-content");
  if (!content) return;

  closeSwipeCards(li);

  swipeStart = {
    li,
    content,
    x: e.clientX,
    y: e.clientY,
    dx: 0,
    pointerId: e.pointerId,
    dragging: false
  };
});

window.addEventListener("pointermove", e => {
  if (!swipeStart || e.pointerId !== swipeStart.pointerId) return;

  const s = swipeStart;
  const dx = e.clientX - s.x;
  const dy = e.clientY - s.y;

  if (!s.dragging) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) {
      swipeStart = null;
      return;
    }

    if (Math.abs(dx) < 6) return;

    s.dragging = true;
    s.content.classList.add("is-dragging");
  }

  // 最大100pxまでカードを動かす
  s.dx = Math.max(-100, Math.min(100, dx));
  s.content.style.transform = `translateX(${s.dx}px)`;
});

function finishSwipe(e) {
  if (!swipeStart || e.pointerId !== swipeStart.pointerId) return;

  const s = swipeStart;
  swipeStart = null;

  s.content.classList.remove("is-dragging");

  if (!s.dragging || Math.abs(s.dx) < 65) {
    s.content.style.transform = "";
    s.li.classList.remove("swipe-open-left", "swipe-open-right");
    return;
  }

  closeSwipeCards(s.li);

  if (s.dx < 0) {
    s.li.classList.remove("swipe-open-right");
    s.li.classList.add("swipe-open-left");
    s.content.style.transform = "";
  } else {
    s.li.classList.remove("swipe-open-left");
    s.li.classList.add("swipe-open-right");
    s.content.style.transform = "";
  }
}

window.addEventListener("pointerup", finishSwipe);

window.addEventListener("pointercancel", () => {
  if (!swipeStart) return;

  swipeStart.content.classList.remove("is-dragging");
  swipeStart.content.style.transform = "";
  swipeStart = null;
});

document.addEventListener("click", e => {
  if (!e.target.closest("#taskList")) {
    closeSwipeCards();
  }
});


$("taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  tasks.unshift({
  id: crypto.randomUUID(),
  text,
  done: false,
  subtasks: []
});
  input.value = "";
  save();
  input.focus();
});
document.querySelectorAll(".filter").forEach(b => {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    render();
  });
});
$("clearDone").onclick = () => {
  tasks = tasks.filter(t => !t.done);
  save();
};
$("voiceButton").onclick = () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("このブラウザでは音声入力を利用できません。入力欄に直接入力してください。");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.focus();
  };
  recognition.onerror = () => alert("音声を認識できませんでした。もう一度お試しください。");
  recognition.start();
};
render();
</script>
</body>
</html>
