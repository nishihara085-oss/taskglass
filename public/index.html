
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f6fa">
<title>Glass Task</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans JP", sans-serif;
  color: #202333;
  background: #f5f6fa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 10% 0%, #e3eaff 0, transparent 45%),
    radial-gradient(ellipse at 100% 20%, #f5e8ff 0, transparent 38%),
    #f7f8fc;
}
main { max-width: 720px; margin: auto; padding: 32px 20px 80px; }
header { display:flex; align-items:center; justify-content:space-between; }
.brand { font-size: 19px; font-weight: 750; letter-spacing:-.5px; }
.brand span { color:#7586ed; }
.date { color:#85899b; font-size:13px; margin-top:6px; }
.panel {
  margin-top:28px; padding:24px; border:1px solid #ffffffd9;
  border-radius:26px; background:#ffffffb8;
  box-shadow:0 12px 42px #303b6010; backdrop-filter:blur(20px);
}
h1 { font-size:clamp(27px,6vw,38px); letter-spacing:-1.4px; margin:0; }
.sub { color:#85899b; font-size:14px; margin:8px 0 24px; }
.entry { display:flex; gap:8px; }
input, button { font:inherit; }
#taskInput {
  flex:1; min-width:0; border:1px solid #e8eaf2; border-radius:15px;
  padding:14px; background:#fff; outline:none;
}
#taskInput:focus { border-color:#8b99f5; box-shadow:0 0 0 3px #8998f522; }
button {
  border:0; border-radius:14px; padding:12px 16px;
  cursor:pointer; transition:transform .15s, opacity .15s;
}
button:active { transform:scale(.97); }
.add { background:#6879e8; color:white; font-weight:650; }
.tools { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.secondary { background:#f0f2fb; color:#626c9c; font-size:13px; }
.filters { display:flex; gap:8px; margin:24px 0 16px; }
.filter { background:transparent; color:#85899b; padding:8px 12px; }
.filter.active { background:#e9ecff; color:#596bd6; font-weight:650; }
#count { margin-left:auto; color:#989caf; font-size:12px; align-self:center; }
ul { list-style:none; margin:0; padding:0; }
li {
  display:flex; align-items:center; gap:12px; padding:15px 4px;
  border-bottom:1px solid #eceef5; animation:appear .22s ease-out;
}
li:last-child { border-bottom:0; }
.check {
  width:22px; height:22px; border:1.5px solid #d4d8e8;
  border-radius:8px; background:white; padding:0; flex-shrink:0;
}
li.done .check { background:#7787e9; border-color:#7787e9; color:white; }
.task { flex:1; overflow-wrap:anywhere; font-size:15px; }
li.done .task { color:#a4a8b7; text-decoration:line-through; }
.delete { background:transparent; color:#a3a7b7; padding:7px 9px; }
.empty { padding:30px 8px; color:#989caf; text-align:center; font-size:14px; }
footer { color:#a1a5b5; text-align:center; font-size:12px; padding-top:22px; }
@keyframes appear { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
/* Liquid Glass: white translucent surfaces */
.panel {
  background: rgba(255, 255, 255, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.92);
  box-shadow:
    0 20px 60px rgba(45, 55, 90, 0.08),
    inset 0 1px 0 rgba(255, 255, 255, 0.9);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  backdrop-filter: blur(28px) saturate(160%);
}

#taskInput {
  background: rgba(255, 255, 255, 0.78);
  border-color: rgba(220, 224, 238, 0.8);
  border-radius: 17px;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

li {
  position: relative;
  border-radius: 14px;
  padding-left: 10px;
  padding-right: 10px;
  margin: 3px 0;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  transition:
    background 0.2s ease,
    transform 0.18s ease,
    box-shadow 0.2s ease;
}

li.swipe-right {
  background: rgba(103, 190, 145, 0.15);
}

li.swipe-left {
  background: rgba(245, 110, 110, 0.13);
}

@media (hover: hover) {
  li:hover {
    background: rgba(255, 255, 255, 0.72);
  }
}

@media (prefers-reduced-motion: reduce) {
  li {
    transition: none;
  }
}
@media(max-width:480px) {
  main { padding:22px 14px 48px; }
  .panel { padding:19px; margin-top:22px; border-radius:22px; }
  .entry { flex-wrap:wrap; }
  #taskInput { width:100%; flex-basis:70%; }
  .add { flex:1; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation:none!important; transition:none!important; }
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="brand"><span>◈</span> Glass Task</div>
      <div class="date" id="today"></div>
    </div>
    <div aria-hidden="true">✧</div>
  </header>

  <section class="panel">
    <h1>思考を、軽やかに。</h1>
    <p class="sub">頭の中のメモを、ひとつずつタスクに。</p>

    <form id="taskForm" class="entry">
      <input id="taskInput" maxlength="500"
        placeholder="次にやることを書き留める…" autocomplete="off"
        aria-label="新しいタスク">
      <button class="add" type="submit">＋ 追加</button>
    </form>
    <div class="tools">
      <button class="secondary" id="voiceButton" type="button">🎙 音声入力</button>
      <button class="secondary" id="clearDone" type="button">完了済みを整理</button>
    </div>

    <div class="filters" aria-label="タスクの絞り込み">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="open">未完了</button>
      <button class="filter" data-filter="done">完了</button>
      <span id="count"></span>
    </div>
    <ul id="taskList"></ul>
    <div id="empty" class="empty">ここから始めましょう。<br>小さな一歩をメモしてみてください。</div>
  </section>
  <footer>あなたのペースで、ひとつずつ。</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const input = $("taskInput");
let tasks = [];
let filter = "all";

try {
  const saved = JSON.parse(localStorage.getItem("glass-task-items") || "[]");
  if (Array.isArray(saved)) tasks = saved;
} catch {}

$("today").textContent = new Intl.DateTimeFormat("ja-JP", {
  year:"numeric", month:"long", day:"numeric", weekday:"long"
}).format(new Date());

function save() {
  localStorage.setItem("glass-task-items", JSON.stringify(tasks));
  render();
}
function render() {
  const list = $("taskList");
  list.replaceChildren();
  const visible = tasks.filter(t =>
    filter === "all" || (filter === "open" && !t.done) ||
    (filter === "done" && t.done)
  );
  $("count").textContent = `未完了 ${tasks.filter(t=>!t.done).length}`;
  $("empty").hidden = visible.length > 0;
  visible.forEach(task => {
    const li = document.createElement("li");
    li.dataset.taskId = task.id;
    if (task.done) li.classList.add("done");
    const check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.textContent = task.done ? "✓" : "";
    check.setAttribute("aria-label", task.done ? "未完了に戻す" : "完了にする");
    check.onclick = () => {
      task.done = !task.done;
      save();
    };
    const text = document.createElement("span");
    text.className = "task";
    text.textContent = task.text;
    const del = document.createElement("button");
    del.className = "delete";
    del.type = "button";
    del.textContent = "削除";
    del.onclick = () => {
      tasks = tasks.filter(t => t.id !== task.id);
      save();
    };
    li.append(check, text, del);
    list.append(li);
  });
  document.querySelectorAll(".filter").forEach(b =>
    b.classList.toggle("active", b.dataset.filter === filter)
  );
}
// Horizontal swipe gestures for task cards
const taskList = $("taskList");
let swipeStart = null;

taskList.addEventListener("pointerdown", e => {
  const li = e.target.closest("li");
  if (!li || e.target.closest("button")) {
    swipeStart = null;
    return;
  }

  swipeStart = {
    id: li.dataset.taskId,
    x: e.clientX,
    y: e.clientY
  };
});

taskList.addEventListener("pointerup", e => {
  if (!swipeStart) return;

  const start = swipeStart;
  swipeStart = null;

  const dx = e.clientX - start.x;
  const dy = e.clientY - start.y;

  // Ignore taps and vertical scrolling
  if (Math.abs(dx) < 75 || Math.abs(dx) < Math.abs(dy) * 1.3) {
    return;
  }

  const task = tasks.find(t => t.id === start.id);
  const li = [...taskList.children].find(
    el => el.dataset.taskId === start.id
  );

  if (!task || !li) return;

  if (dx > 0) {
    // Swipe right: complete or reopen
    task.done = !task.done;
    li.classList.add("swipe-right");
    save();
  } else {
    // Swipe left: confirm before deleting
    li.classList.add("swipe-left");

    if (confirm(`「${task.text}」を削除しますか？`)) {
      tasks = tasks.filter(t => t.id !== task.id);
      save();
    } else {
      li.classList.remove("swipe-left");
    }
  }
});

taskList.addEventListener("pointercancel", () => {
  swipeStart = null;
});
$("taskForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  tasks.unshift({id: crypto.randomUUID(), text, done:false});
  input.value = "";
  save();
  input.focus();
});
document.querySelectorAll(".filter").forEach(b => {
  b.addEventListener("click", () => {
    filter = b.dataset.filter;
    render();
  });
});
$("clearDone").onclick = () => {
  tasks = tasks.filter(t => !t.done);
  save();
};
$("voiceButton").onclick = () => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("このブラウザでは音声入力を利用できません。入力欄に直接入力してください。");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = "ja-JP";
  recognition.onresult = e => {
    input.value = e.results[0][0].transcript;
    input.focus();
  };
  recognition.onerror = () => alert("音声を認識できませんでした。もう一度お試しください。");
  recognition.start();
};
render();
</script>
</body>
</html>
